name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: |
          cat > settings.gradle.kts <<'END_OF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SmsSync"
          include(":app")
          END_OF_FILE
          cat > build.gradle.kts <<'END_OF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          END_OF_FILE
          cat > gradle.properties <<'END_OF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          END_OF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'END_OF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.smssync"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.smssync"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.work:work-runtime-ktx:2.9.1") }
          END_OF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'END_OF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="SMS Sync" android:allowBackup="false" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter><action android:name="android.provider.Telephony.SMS_RECEIVED"/></intent-filter>
                  </receiver>
              </application>
          </manifest>
          END_OF_FILE
          mkdir -p app/src/main/java/com/example/smssync
          cat > app/src/main/java/com/example/smssync/MainActivity.kt <<'END_OF_FILE'
          package com.example.smssync

          import android.Manifest
          import android.app.Activity
          import android.content.Context
          import android.os.Bundle
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {
              private fun field(hint: String, key: String, pw: Boolean = false) = EditText(this).apply {
                  this.hint = hint
                  setText(getSharedPreferences("cfg", Context.MODE_PRIVATE).getString(key, ""))
                  setSingleLine()
                  if (pw) inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
              }

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val url = field("Supabase Project URL", "url")
                  val key = field("Supabase anon key", "key")
                  val email = field("Email", "email")
                  val pass = field("Password", "pass", true)
                  val status = TextView(this)
                  val save = Button(this).apply { text = "Save and grant SMS permission" }
                  val backfill = Button(this).apply { text = "Upload last 500 messages" }

                  save.setOnClickListener {
                      getSharedPreferences("cfg", Context.MODE_PRIVATE).edit()
                          .putString("url", url.text.toString().trim().trimEnd('/'))
                          .putString("key", key.text.toString().trim())
                          .putString("email", email.text.toString().trim())
                          .putString("pass", pass.text.toString()).apply()
                      requestPermissions(arrayOf(Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS), 1)
                      status.text = "Saved. New texts will upload automatically."
                  }
                  backfill.setOnClickListener {
                      backfillInbox(this)
                      status.text = "Upload started. Check the viewer in a minute."
                  }
                  setContentView(ScrollView(this).apply {
                      addView(LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(48, 96, 48, 48)
                          listOf(url, key, email, pass, save, backfill, status).forEach { addView(it) }
                      })
                  })
              }
          }
          END_OF_FILE
          mkdir -p app/src/main/java/com/example/smssync
          cat > app/src/main/java/com/example/smssync/SmsSync.kt <<'END_OF_FILE'
          package com.example.smssync

          import android.content.*
          import android.provider.Telephony
          import androidx.work.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class SmsReceiver : BroadcastReceiver() {
              override fun onReceive(ctx: Context, intent: Intent) {
                  val msgs = Telephony.Sms.Intents.getMessagesFromIntent(intent) ?: return
                  val arr = JSONArray()
                  msgs.groupBy { it.originatingAddress ?: "unknown" }.forEach { (addr, parts) ->
                      arr.put(row(addr, parts.joinToString("") { it.messageBody ?: "" }, parts.first().timestampMillis, "in"))
                  }
                  enqueue(ctx, arr)
              }
          }

          fun row(addr: String, body: String, ts: Long, dir: String) = JSONObject().apply {
              put("device_id", android.os.Build.MODEL)
              put("address", addr)
              put("body", body)
              put("direction", dir)
              put("sent_at", java.time.Instant.ofEpochMilli(ts).toString())
              put("dedupe_key", "$addr|$ts|${body.hashCode()}")
          }

          fun enqueue(ctx: Context, rows: JSONArray) {
              WorkManager.getInstance(ctx).enqueue(
                  OneTimeWorkRequestBuilder<UploadWorker>()
                      .setInputData(workDataOf("rows" to rows.toString()))
                      .setConstraints(Constraints.Builder().setRequiredNetworkType(NetworkType.CONNECTED).build())
                      .setBackoffCriteria(BackoffPolicy.EXPONENTIAL, 30, java.util.concurrent.TimeUnit.SECONDS)
                      .build()
              )
          }

          class UploadWorker(private val ctx: Context, p: WorkerParameters) : Worker(ctx, p) {
              private val cfg = ctx.getSharedPreferences("cfg", Context.MODE_PRIVATE)
              private val url get() = cfg.getString("url", "")!!
              private val key get() = cfg.getString("key", "")!!

              override fun doWork(): Result = try {
                  val token = login()
                  (URL("$url/rest/v1/sms_messages?on_conflict=user_id,dedupe_key").openConnection() as HttpURLConnection).run {
                      requestMethod = "POST"; doOutput = true
                      setRequestProperty("apikey", key)
                      setRequestProperty("Authorization", "Bearer $token")
                      setRequestProperty("Content-Type", "application/json")
                      setRequestProperty("Prefer", "resolution=ignore-duplicates")
                      outputStream.use { it.write(inputData.getString("rows")!!.toByteArray()) }
                      if (responseCode in 200..299) Result.success() else Result.retry()
                  }
              } catch (e: Exception) { Result.retry() }

              private fun login(): String {
                  val body = JSONObject().put("email", cfg.getString("email", "")).put("password", cfg.getString("pass", ""))
                  (URL("$url/auth/v1/token?grant_type=password").openConnection() as HttpURLConnection).run {
                      requestMethod = "POST"; doOutput = true
                      setRequestProperty("apikey", key)
                      setRequestProperty("Content-Type", "application/json")
                      outputStream.use { it.write(body.toString().toByteArray()) }
                      return JSONObject(inputStream.bufferedReader().readText()).getString("access_token")
                  }
              }
          }

          // WorkManager input data is capped at ~10 KB, so upload history in small batches.
          fun backfillInbox(ctx: Context) {
              val all = mutableListOf<JSONObject>()
              ctx.contentResolver.query(Telephony.Sms.CONTENT_URI, arrayOf("address", "body", "date", "type"),
                  null, null, "date DESC LIMIT 500")?.use { c ->
                  while (c.moveToNext()) {
                      val dir = if (c.getInt(3) == Telephony.Sms.MESSAGE_TYPE_SENT) "out" else "in"
                      all.add(row(c.getString(0) ?: "unknown", c.getString(1) ?: "", c.getLong(2), dir))
                  }
              }
              all.chunked(8).forEach { enqueue(ctx, JSONArray(it)) }
          }
          END_OF_FILE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SmsSync-apk
          path: app/build/outputs/apk/debug/app-debug.apk
